<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">商品賣點排版</title>
  <desc id="desc">深色科技風商品賣點版面，包含規格、使用情境與組合資訊三個資訊卡。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset="0.52" stop-color="#19b8ff"/>
      <stop offset="0.521" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111e"/>
      <stop offset="1" stop-color="#172740"/>
    </linearGradient>
    <linearGradient id="product" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset="0.18" stop-color="#e9f6ff"/>
      <stop offset="0.42" stop-color="#22324c"/>
      <stop offset="1" stop-color="#030814"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-25%" width="170%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#07101d" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="1200" height="820" fill="url(#bg)"/>
  <rect x="60" y="58" width="144" height="58" rx="14" fill="#ffffff"/>
  <text x="132" y="96" text-anchor="middle" font-family="'Noto Sans TC', Arial, sans-serif" font-size="25" font-weight="800" fill="#06111d">賣點</text>
  <g filter="url(#shadow)">
    <rect x="306" y="172" width="586" height="310" rx="22" fill="#ffffff" opacity="0.94"/>
    <rect x="488" y="96" width="224" height="318" rx="60" fill="url(#product)"/>
    <rect x="510" y="286" width="180" height="42" rx="21" fill="#19b8ff"/>
    <rect x="548" y="190" width="104" height="94" rx="18" fill="#ffffff" opacity="0.14" stroke="#ffffff" stroke-opacity="0.54" stroke-width="2"/>
  </g>
  <g font-family="'Noto Sans TC', Arial, sans-serif">
    <rect x="74" y="536" width="326" height="104" rx="18" fill="url(#panel)" opacity="0.94"/>
    <text x="110" y="584" font-size="22" font-weight="900" fill="#19b8ff">01</text>
    <text x="162" y="584" font-size="26" font-weight="900" fill="#ffffff">規格資訊</text>
    <text x="162" y="618" font-size="18" font-weight="700" fill="#b7c7dc">尺寸、容量、款式一眼看懂</text>
    <rect x="438" y="536" width="326" height="104" rx="18" fill="url(#panel)" opacity="0.94"/>
    <text x="474" y="584" font-size="22" font-weight="900" fill="#19b8ff">02</text>
    <text x="526" y="584" font-size="26" font-weight="900" fill="#ffffff">使用情境</text>
    <text x="526" y="618" font-size="18" font-weight="700" fill="#b7c7dc">把商品放進買家生活場景</text>
    <rect x="802" y="536" width="326" height="104" rx="18" fill="url(#panel)" opacity="0.94"/>
    <text x="838" y="584" font-size="22" font-weight="900" fill="#19b8ff">03</text>
    <text x="890" y="584" font-size="26" font-weight="900" fill="#ffffff">組合資訊</text>
    <text x="890" y="618" font-size="18" font-weight="700" fill="#b7c7dc">促銷、組數、加購清楚呈現</text>
  </g>
  <rect x="74" y="682" width="1054" height="72" rx="16" fill="#ffffff" opacity="0.82"/>
  <text x="600" y="729" text-anchor="middle" font-family="'Noto Sans TC', Arial, sans-serif" font-size="34" font-weight="900" fill="#06111d">3 大資訊模組排版</text>
</svg>
