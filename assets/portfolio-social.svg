<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">社群封面版型</title>
  <desc id="desc">深色斜切構圖的 IG 與小紅書商品封面圖，適合新品上架與短影音封面。</desc>
  <defs>
    <linearGradient id="cream" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ec"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6fbff"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#030814"/>
    </linearGradient>
    <linearGradient id="product" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#dff7ff"/>
      <stop offset="0.44" stop-color="#142033"/>
      <stop offset="1" stop-color="#06101d"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#020814" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="1200" height="820" fill="url(#cream)"/>
  <path d="M0 662 L1200 54 L1200 820 L0 820 Z" fill="url(#dark)"/>
  <path d="M784 0 L1200 0 L1200 280 Z" fill="#101827"/>
  <rect x="58" y="58" width="144" height="58" rx="14" fill="#ffffff"/>
  <text x="130" y="96" text-anchor="middle" font-family="'Noto Sans TC', Arial, sans-serif" font-size="25" font-weight="800" fill="#06111d">社群</text>
  <g filter="url(#shadow)">
    <rect x="428" y="132" width="344" height="430" rx="78" fill="#101827"/>
    <rect x="446" y="152" width="308" height="390" rx="64" fill="#eaffff"/>
    <rect x="536" y="248" width="128" height="214" rx="52" fill="url(#product)"/>
    <rect x="558" y="324" width="84" height="78" rx="16" fill="#ffffff" opacity="0.18" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  </g>
  <g font-family="'Noto Sans TC', Arial, sans-serif">
    <text x="80" y="544" font-size="34" font-weight="900" fill="#06111d">新品上架</text>
    <text x="80" y="594" font-size="22" font-weight="800" fill="#526176">IG / 小紅書封面</text>
    <rect x="72" y="624" width="1056" height="116" rx="18" fill="#ffffff" opacity="0.84"/>
    <text x="600" y="680" text-anchor="middle" font-size="38" font-weight="900" fill="#06111d">社群短影音封面版</text>
    <text x="600" y="716" text-anchor="middle" font-size="22" font-weight="700" fill="#526176">適合貼文首圖、Reels、TikTok 商品曝光</text>
  </g>
</svg>
