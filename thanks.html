<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>已收到詢價｜ADFORGE AI</title>
    <meta name="description" content="ADFORGE AI 已收到你的詢價資料，我們通常會在 24 小時內回覆。" />
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://adforge-ai-tw.netlify.app/thanks.html" />
    <link rel="icon" href="assets/adforge-logo-mark.png" />
    <link rel="apple-touch-icon" href="assets/adforge-logo-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="thanks-page">
      <section class="section-shell thanks-card" aria-labelledby="thanks-title">
        <span class="brand-logo-mark">
          <img src="assets/adforge-logo-mark.png" alt="" />
        </span>
        <p class="kicker">ADFORGE AI</p>
        <h1 id="thanks-title">已收到你的需求資料</h1>
        <p>
          我們通常會在 24 小時內回覆。若你想更快開始，請加入 LINE 傳商品照片、商品名稱、上架平台與 3 個賣點，我們會協助確認免費試做 9 張上架圖。
        </p>
        <div class="hero-actions">
          <a class="button button-primary" href="https://page.line.me/ndb3949k?openQrModal=true" target="_blank" rel="noopener noreferrer">加入 LINE 傳商品照片</a>
          <a class="button button-secondary" href="/">回到首頁</a>
        </div>
      </section>
    </main>
    <script>
      document.querySelectorAll('a[href^="https://page.line.me/"]').forEach((link) => {
        link.addEventListener("click", (event) => {
          if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button > 0) {
            return;
          }

          event.preventDefault();
          window.location.assign(link.href);
        });
      });
    </script>
  </body>
</html>
